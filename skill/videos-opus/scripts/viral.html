<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Camada da edição viral (padrão premium)</title>
<!--CFG-->
<style>
  /* PADRÃO PREMIUM (regra da skill): nenhum contorno nas letras, nenhum raio/espiral, nenhuma faísca,
     nenhum flash branco. Leitura vem de sombra suave e véu; movimento é lento e suave. */
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #palco { position: relative; width: 1080px; overflow: hidden; transform-origin: 0 0; color: #F5EFE4; font-family: "Serif", Georgia, serif; }
  .el { position: absolute; opacity: 0; will-change: transform, opacity; }
  .caps { font-family: "Caps", "Segoe UI", sans-serif; font-weight: 500; letter-spacing: .32em; text-transform: uppercase; font-size: 24px; }
  .sombra { text-shadow: 0 4px 40px rgba(0,0,0,.5), 0 1px 4px rgba(0,0,0,.45); }
  #veu { inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(20,10,5,.18) 0%, rgba(20,10,5,.66) 78%); }
  #veuInf { inset: 0; background: linear-gradient(180deg, rgba(20,10,5,0) 46%, rgba(20,10,5,.5) 70%, rgba(20,10,5,.78) 100%); }
  .linha { left: 0; right: 0; text-align: center; line-height: 1; font-weight: 400; }
  .linha span { display: inline-block; }
  .linha.ital { font-style: italic; font-weight: 500; }
  .fio { height: 1.5px; transform-origin: 50% 50%; }
  #tag { left: 0; right: 0; text-align: center; }
  #luz { width: 280px; height: 640px; background: linear-gradient(100deg, rgba(255,240,215,0) 0%, rgba(255,240,215,.36) 50%, rgba(255,240,215,0) 100%); transform: rotate(18deg); mix-blend-mode: soft-light; }
  #selo { left: 0; right: 0; text-align: center; }
  #selo span { display: inline-block; padding-bottom: 10px; border-bottom: 1px solid; font-size: 22px; }
  .chave { left: 70px; right: 70px; text-align: center; line-height: 1.02; font-weight: 400; }
  .chave .p { display: inline-block; margin: 0 12px; }
  .chave .p.ult { font-style: italic; font-weight: 500; }
  #botao { left: 170px; right: 170px; text-align: center; }
  #botao span { display: inline-block; border: 1.5px solid; border-radius: 100px; padding: 22px 60px 24px; font-style: italic; font-size: 64px; background: rgba(20,10,5,.45); }
</style>
</head>
<body>
<div id="palco">
  <div id="veu" class="el"></div>
  <div id="veuInf" class="el"></div>
  <div id="linhas"></div>
  <div id="fio1" class="el fio"></div><div id="fio2" class="el fio"></div>
  <div id="tag" class="el caps"></div>
  <div id="luz" class="el"></div>
  <div id="selo" class="el"><span class="caps"></span></div>
  <div id="chaves"></div>
  <div id="botao" class="el"><span></span></div>
</div>
<script>
  // CFG vem do comando viral: { W, H, cor, corCta, abertura: {fim, linhas[], tag}, selo, chaves: [{ini, fim, texto}], cta: {ini, fim, texto} }
  const C = window.CFG;
  const H0 = Math.round(C.H * 1080 / C.W);
  const Y = (f) => Math.round(H0 * f);
  const $ = (id) => document.getElementById(id);
  const palco = $("palco");
  palco.style.height = H0 + "px";
  palco.style.transform = `scale(${C.W / 1080})`;
  const OURO = C.cor;

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const suave = (x) => 1 - Math.pow(1 - x, 3);
  const seda = (x) => x * x * (3 - 2 * x);
  const set = (el, o, tr = "") => { el.style.opacity = o; el.style.transform = tr; };
  const letras = (el, txt) => { for (const ch of txt) { const s = document.createElement("span"); s.textContent = ch === " " ? " " : ch; el.appendChild(s); } return [...el.children]; };

  // ---- abertura: filetes, tag em versalete, linhas letra a letra (a última em itálico na cor), brilho de luz
  const A = C.abertura;
  const linhas = [];
  let yTopo = Y(.40), yFim = Y(.60);
  if (A) {
    const n = A.linhas.length;
    const tam = A.linhas.map((l, i) => { const ital = i === n - 1 && n > 1; return Math.min(ital ? 190 : 140, Math.floor((ital ? 1500 : 1300) / Math.max(4, l.length))); });
    const altura = tam.reduce((s, x) => s + x * 1.02, 0);
    let y = Y(.50) - altura / 2;
    yTopo = y - 60; yFim = y + altura + 34;
    A.linhas.forEach((txt, i) => {
      const d = document.createElement("div");
      const ital = i === n - 1 && n > 1;
      d.className = "el linha sombra" + (ital ? " ital" : "");
      d.style.fontSize = tam[i] + "px"; d.style.top = y + "px";
      if (ital) d.style.color = OURO;
      $("linhas").appendChild(d);
      linhas.push({ d, spans: letras(d, txt), t0: 0.45 + i * 0.4, ital });
      y += tam[i] * 1.02;
    });
    for (const [id, top] of [["fio1", yTopo], ["fio2", yFim]]) { $(id).style.cssText += `left:440px;width:200px;top:${top}px;background:${OURO}`; }
    $("tag").textContent = A.tag || ""; $("tag").style.top = (yTopo - 56) + "px"; $("tag").style.color = OURO;
    $("luz").style.top = (yTopo - 40) + "px";
  }
  $("selo").style.top = Y(.10) + "px";
  $("selo").firstChild.textContent = C.selo || "";
  $("selo").firstChild.style.color = "#F5EFE4"; $("selo").firstChild.style.borderColor = OURO;

  // ---- frases-chave: serifa, palavra a palavra, a última em itálico na cor
  const chaves = (C.chaves || []).map((k) => {
    const d = document.createElement("div");
    d.className = "el chave sombra";
    const palavras = k.texto.split(/\s+/);
    d.style.fontSize = Math.min(150, Math.floor(2400 / Math.max(8, k.texto.length)) + 30) + "px";
    d.style.top = Y(.64) + "px";
    palavras.forEach((w, j) => { const s = document.createElement("span"); s.className = "p" + (j === palavras.length - 1 ? " ult" : ""); s.textContent = w; if (j === palavras.length - 1) s.style.color = OURO; d.appendChild(s); });
    $("chaves").appendChild(d);
    return { ...k, d, spans: [...d.children] };
  });

  if (C.cta) {
    $("botao").style.top = Y(.72) + "px";
    $("botao").firstChild.textContent = C.cta.texto.toLocaleLowerCase("pt-BR") + "  →";
    $("botao").firstChild.style.borderColor = OURO;
  }

  function render(t) {
    // abertura
    const fimA = A ? A.fim : 0, emA = A && t < fimA;
    const saida = A ? prog(t, fimA - 0.6, fimA) : 1;
    set($("veu"), A ? seda(prog(t, 0, 0.6)) * (1 - seda(prog(t, fimA - 0.5, fimA + 0.1))) : 0);
    for (const id of ["fio1", "fio2"]) set($(id), emA ? 1 - saida : 0, `scaleX(${seda(prog(t, 0.25, 1.1))})`);
    set($("tag"), emA && A.tag ? suave(prog(t, 0.35, 0.9)) * (1 - saida) : 0, `translateY(${(1 - suave(prog(t, 0.35, 0.9))) * 10}px)`);
    for (const l of linhas) {
      set(l.d, emA ? 1 - saida : 0, `translateY(${-saida * 14}px)`);
      l.spans.forEach((s, k) => { const p = suave(prog(t, l.t0 + k * (l.ital ? 0.07 : 0.045), l.t0 + k * (l.ital ? 0.07 : 0.045) + (l.ital ? 0.9 : 0.7))); s.style.opacity = p; s.style.transform = `translateY(${(1 - p) * (l.ital ? 36 : 28)}px)`; });
    }
    const lz = prog(t, 1.4, 2.8);
    set($("luz"), emA && lz > 0 && lz < 1 ? 1 : 0, `translateX(${-400 + seda(lz) * 1900}px) rotate(18deg)`);

    // véu inferior durante a fala: legibilidade da legenda e das frases-chave sem contorno
    set($("veuInf"), suave(prog(t, fimA - 0.2, fimA + 0.5)));

    // selo
    const sl = suave(prog(t, fimA + 0.2, fimA + 0.8));
    set($("selo"), C.selo && t >= fimA + 0.2 ? sl : 0, `translateY(${(1 - sl) * -12}px)`);

    // frases-chave
    for (const k of chaves) {
      if (t < k.ini || t >= k.fim) { set(k.d, 0); continue; }
      const sai = seda(prog(t, k.fim - 0.3, k.fim));
      set(k.d, 1 - sai, `scale(${1 + 0.03 * prog(t, k.ini, k.fim)})`);
      const passo = Math.min(0.28, (k.fim - k.ini) / (k.spans.length + 1));
      k.spans.forEach((sp, j) => { const p = suave(prog(t, k.ini + j * passo, k.ini + j * passo + 0.45)); sp.style.opacity = p; sp.style.transform = `translateY(${(1 - p) * 22}px)`; });
    }

    // chamada: botão em contorno fino na cor, respiração lenta
    if (C.cta) {
      const on = t >= C.cta.ini && t < C.cta.fim;
      const pb = suave(prog(t, C.cta.ini, C.cta.ini + 0.5)), sai = seda(prog(t, C.cta.fim - 0.3, C.cta.fim));
      set($("botao"), on ? pb * (1 - sai) : 0, `translateY(${(1 - pb) * 20}px) scale(${1 + 0.015 * Math.sin((t - C.cta.ini) * 3)})`);
    }
  }

  window.__render = render;
  const m = location.hash.match(/^#t([\d.]+)/);
  Promise.all([document.fonts.load('100px "Serif"'), document.fonts.load('italic 500 100px "Serif"'), document.fonts.load('24px "Caps"')])
    .then(() => { render(m ? parseFloat(m[1]) : 0); window.__pronto = true; });
</script>
</body>
</html>
