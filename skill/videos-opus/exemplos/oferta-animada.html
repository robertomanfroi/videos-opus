<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Oferta animada — exemplo</title>
<!--
  Exemplo de referência para vídeos animados da skill videos-opus (10 s, reels 1080x1920).
  Regras que todo vídeo animado segue:
  - a animação inteira é uma função pura do tempo, render(t), exposta em window.__render;
  - com o endereço terminando em #t<segundos> a página desenha só aquele instante;
  - window.__pronto = true quando as fontes carregarem;
  - fontes locais da skill (../fontes), nada da internet.
  Grave com:  video.mjs animar "<este arquivo>" --segundos 10
-->
<style>
  @font-face { font-family: "Bebas"; src: url("../fontes/BebasNeue-Regular.ttf"); }
  @font-face { font-family: "Garamond"; src: url("../fontes/EBGaramond-Italic.ttf"); font-style: italic; font-weight: 400 800; }
  @font-face { font-family: "Montserrat"; src: url("../fontes/Montserrat-Black.ttf"); }
  :root { --fundo: #3B1F0E; --cor: #C14B22; --claro: #F5EFE4; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--fundo); }
  #palco { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: var(--claro); font-family: "Bebas", sans-serif;
    background: radial-gradient(circle at 50% 38%, #5C2E0E 0%, var(--fundo) 60%); }
  .el { position: absolute; left: 0; right: 0; text-align: center; opacity: 0; will-change: transform, opacity, filter; }
  #rotulo { top: 520px; font-family: "Montserrat"; font-size: 40px; letter-spacing: 12px; color: var(--cor); }
  #titulo { top: 620px; font-size: 250px; line-height: .86; letter-spacing: 2px; }
  #italico { top: 1060px; font-family: "Garamond"; font-style: italic; font-weight: 600; font-size: 170px; color: var(--cor); }
  #preco { top: 760px; font-size: 420px; line-height: 1; color: var(--claro); }
  #preco small { font-size: 140px; vertical-align: top; }
  #de { top: 680px; font-family: "Montserrat"; font-size: 54px; color: rgba(245,239,228,.6); text-decoration: line-through; }
  #botao { left: 140px; right: 140px; top: 1330px; height: 150px; border-radius: 80px; background: var(--cor); font-size: 84px; line-height: 160px; letter-spacing: 3px; }
  #barra { left: 0; top: 0; height: 14px; width: 1080px; background: var(--cor); transform-origin: left center; opacity: 1; }
</style>
</head>
<body>
<div id="palco">
  <div id="barra" class="el"></div>
  <div id="rotulo" class="el">SÓ ESTA SEMANA</div>
  <div id="titulo" class="el">SEU NOVO<br>VÍDEO</div>
  <div id="italico" class="el">em minutos.</div>
  <div id="de" class="el">de R$ 197</div>
  <div id="preco" class="el"><small>R$</small>97</div>
  <div id="botao" class="el">QUERO AGORA</div>
</div>
<script>
  const DURACAO = 10;
  const $ = (id) => document.getElementById(id);
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const backOut = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const set = (el, o, tr = "", f = "") => { el.style.opacity = o; el.style.transform = tr; el.style.filter = f; };

  function render(t) {
    $("barra").style.transform = `scaleX(${t / DURACAO})`;
    // cena 1 (0–4,5 s): promessa
    const sai1 = prog(t, 4.2, 4.6);
    const r = prog(t, 0.2, 0.6);
    set($("rotulo"), easeOut(r) * (1 - sai1), `translateY(${(1 - easeOut(r)) * 40}px)`);
    const ti = prog(t, 0.5, 0.9);
    set($("titulo"), easeOut(ti) * (1 - sai1), `scale(${2.2 - 1.2 * easeOut(ti) + sai1 * 0.6})`, `blur(${(1 - easeOut(ti)) * 16 + sai1 * 20}px)`);
    const it = prog(t, 1.3, 1.8);
    set($("italico"), easeOut(it) * (1 - sai1), `translateY(${(1 - easeOut(it)) * 60}px)`);
    // cena 2 (4,6–10 s): preço e chamada
    const de = prog(t, 4.7, 5.1);
    set($("de"), easeOut(de), `translateY(${(1 - easeOut(de)) * -30}px)`);
    const pr = prog(t, 5.1, 5.5);
    set($("preco"), t < 5.1 ? 0 : 1, `scale(${0.3 + 0.7 * backOut(pr)})`);
    const bt = prog(t, 6.2, 6.6);
    const pulso = t > 6.6 ? 1 + 0.04 * Math.sin((t - 6.6) * 8) : 1;
    set($("botao"), easeOut(bt), `scale(${(0.6 + 0.4 * backOut(bt)) * pulso})`);
  }

  window.__render = render;
  const m = location.hash.match(/^#t([\d.]+)/);
  Promise.all([document.fonts.load('100px "Bebas"'), document.fonts.load('italic 600 100px "Garamond"'), document.fonts.load('100px "Montserrat"')])
    .then(() => {
      if (m) { render(parseFloat(m[1])); window.__pronto = true; return; }
      window.__pronto = true;
      const ini = performance.now();
      const loop = () => { const t = (performance.now() - ini) / 1000; render(t % DURACAO); requestAnimationFrame(loop); };
      loop();
    });
</script>
</body>
</html>
