<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Reel</title>
<script src="assets/gsap.min.js"></script>
<style>
/* ===== estilo "editado no celular" — leia SKILL.md antes de mudar qualquer coisa aqui ===== */
@font-face{font-family:"Titulo";src:url("assets/fonts/ArchivoBlack-Regular.ttf") format("truetype");font-weight:700}
@font-face{font-family:"Inter";src:url("assets/fonts/Inter-Variable.ttf") format("truetype");font-weight:100 900}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;color:#fff}
#reel{position:relative;width:1080px;height:1920px;overflow:hidden}
#cam{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}

/* Elementos ficam soltos, como adesivos arrastados no celular. Sem fundo, sem card, sem vidro. */
.ov{position:absolute;opacity:0}
/* Texto acima da cabeça: fonte de título, branca, PEQUENA, alinhada à esquerda com a borda do print. */
.tit{font-family:"__FONT_TITLE__","Titulo",sans-serif;font-weight:700;line-height:1.02;text-align:left;letter-spacing:-.01em}
/* Sans para rótulos curtos como Ruim / Bom / Viral */
.sans{font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-weight:600;line-height:1.05}
/* Sombra SÓ quando a parede atrás é clara e engole o texto branco. */
.sh{text-shadow:0 2px 6px rgba(0,0,0,.45)}
/* Cor de destaque: a da aluna (perfil.json) ou o amarelo padrão. Use em UMA palavra por título, no máximo. */
.y{color:__ACCENT__}
/* Prints: recorte cru, canto reto, sem borda, sem sombra. */
.print{position:absolute;display:block;opacity:0}
/* Emoji (Twemoji) — tamanho acompanha a fonte */
img.emo{height:1em;width:auto;vertical-align:-.12em}
/* Legenda: UMA palavra por vez, branca com sombra suave (sem contorno), no peito logo abaixo do queixo */
#cap{position:absolute;left:0;top:__CAP_TOP__px;width:1080px;height:80px}
.w{position:absolute;left:0;top:0;width:1080px;text-align:center;font-family:"__FONT_TITLE__","Titulo",sans-serif;font-weight:700;font-size:54px;line-height:80px;
  ;text-shadow:0 3px 18px rgba(0,0,0,.6),0 0 6px rgba(0,0,0,.5)}
</style></head><body>
<div id="reel" data-composition-id="reel" data-start="0" data-duration="__DUR__" data-width="1080" data-height="1920">
  <video id="cam" src="assets/clean.mp4" data-start="0" data-duration="__DUR__" data-track-index="0" muted playsinline></video>
  <audio id="voice" src="assets/clean.mp4" data-start="0" data-duration="__DUR__" data-track-index="1" data-volume="1"></audio>

  <!-- ===== ELEMENTOS (exemplos — troque por vídeo) =====
  <div class="ov tit" id="titulo" style="left:210px;top:720px;width:800px;font-size:60px">Guia do <span class="y">algoritmo</span> 2026</div>
  <img class="print" id="p-curtidas" src="assets/prints/curtidas.png" style="left:210px;top:180px;width:520px" alt="">
  <div class="ov tit sh" id="chk1" style="left:210px;top:650px;width:800px;font-size:44px">✅ Gostam ou concordam</div>  (borda esquerda = borda do print)
  -->

  <div id="cap">__CAPTIONS__</div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
// Tudo entra e sai em corte seco — sem fade, sem slide, sem zoom.
const show = (sel, t) => tl.set(sel, { opacity: 1 }, t);
const hide = (sel, t) => tl.set(sel, { opacity: 0 }, t);

// ===== TEMPOS (troque por vídeo; valores de ancoras.mjs, na palavra falada) =====
// show("#titulo", 0.0);
// show("#p-curtidas", 0.4); hide("#p-curtidas", 2.1);

window.__timelines = window.__timelines || {};
window.__timelines["reel"] = tl;
</script>
</body></html>
