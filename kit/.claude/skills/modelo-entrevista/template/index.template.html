<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Reel</title>
<script src="assets/gsap.min.js"></script>
<style>
/* ===== modelo ENTREVISTA — medidas tiradas dos reels da Suellen (leia SKILL.md antes de mudar) ===== */
@font-face{font-family:"Figtree";src:url("assets/fonts/Figtree.ttf") format("truetype");font-weight:300 900}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;color:#fff}
#reel{position:relative;width:1080px;height:1920px;overflow:hidden}
#cam{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
/* título do gancho: centralizado, 3 a 4 linhas, 64 px, entrelinha 71 px, bloco a 55% da altura */
#titulo{position:absolute;left:170px;width:740px;top:1075px;transform:translateY(-50%);text-align:center;
  font-family:"Figtree",sans-serif;font-weight:700;font-size:64px;line-height:71px;letter-spacing:-.005em;
  text-shadow:0 0 12px rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.55)}
/* print do perfil do convidado: cabeçalho cru do Instagram (barra do @, foto, números, bio, link), 644 px de largura,
   canto reto, sem borda, sem sombra; topo entre y=920 e y=1010, sobre o tronco DELE (nunca no rosto) */
.perfil{position:absolute;width:644px;height:auto}
</style></head><body>
<div id="reel" data-composition-id="reel" data-start="0" data-duration="__DUR__" data-width="1080" data-height="1920">
  <video id="cam" src="assets/clean.mp4" data-start="0" data-duration="__DUR__" data-track-index="0" muted playsinline></video>
  <audio id="voz" src="assets/clean.mp4" data-start="0" data-duration="__DUR__" data-track-index="1" data-volume="1"></audio>

  <!-- ===== GANCHO (troque: FIM = fim da abertura com os convidados) ===== -->
  <div class="clip" id="titulo" data-start="0" data-duration="FIM" data-track-index="2">Entrevistei empreendedores e eles abriram o jogo</div>

  <!-- ===== PERFIS (um por convidado; entra ~0,3 s depois do corte para ele e sai no próximo corte) =====
  <img class="perfil clip" id="p1" src="assets/prints/convidado1.png" style="left:218px;top:960px" data-start="0.3" data-duration="1.6" data-track-index="3" alt="">
  -->
</div>
<script>
const tl = gsap.timeline({ paused: true });
// Corte seco: títulos e perfis aparecem e somem sem animação.
window.__timelines = window.__timelines || {};
window.__timelines["reel"] = tl;
</script>
</body></html>
